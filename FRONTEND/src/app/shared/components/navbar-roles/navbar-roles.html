<!-- ALERTA PERSISTENTE DE CAJÓN DE DINERO ABIERTO (OPCIÓN 03) -->
<div id="drawer-open-banner" class="hidden bg-rose-600 text-white px-4 py-2.5 flex items-center justify-between shadow-lg z-40 border-b-2 border-rose-400 animate-pulse">
  <div class="flex items-center gap-3">
    <i class="fa-solid fa-cash-register text-xl"></i>
    <div>
      <p class="font-black text-xs sm:text-sm uppercase tracking-wide">⚠️ ATENCIÓN: CAJÓN DE DINERO FÍSICO ABIERTO (OPCIÓN 03)</p>
      <p class="text-[11px] text-rose-100">Como el cajón no tiene sensor por cable, confirma aquí apenas lo cierres manualmente para continuar.</p>
    </div>
  </div>
  <button onclick="confirmDrawerClosed()" class="px-4 py-1.5 bg-white text-rose-700 hover:bg-rose-50 font-black rounded-lg text-xs uppercase shadow-md shrink-0">
    <i class="fa-solid fa-lock mr-1"></i> Confirmar Cajón Cerrado
  </button>
</div>

<!-- BARRA SUPERIOR DE NAVEGACIÓN DE MÓDULOS Y ROL ACTIVO -->
<header class="bg-slate-900 text-white px-3 py-2 border-b border-slate-800 z-30 shrink-0 relative">
  <div class="flex items-center justify-between gap-2 flex-nowrap">
    <div class="flex items-center gap-2 shrink-0">
      <div class="bg-[#d96b27] text-white w-8 h-8 sm:w-9 sm:h-9 rounded-lg flex items-center justify-center font-black text-sm sm:text-base shadow shrink-0">
        <i class="fa-solid fa-car-burst"></i>
      </div>
      <div class="leading-tight">
        <div class="flex items-center gap-1.5">
          <span class="font-black text-xs sm:text-sm tracking-tight whitespace-nowrap">AUTOPOS <span class="text-amber-400">NCR</span></span>
          <span id="header-role-badge" class="text-[9px] sm:text-[10px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 whitespace-nowrap">
            CAJERO
          </span>
        </div>
        <p id="header-operator-info" class="text-[10px] text-slate-400 font-mono-code truncate max-w-[160px] sm:max-w-[230px]">Op: 0019 CRISTIAN ELINSON OLA</p>
      </div>
    </div>

    <nav class="hidden xl:flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700 gap-1 flex-nowrap overflow-x-auto">
      <button onclick="switchModule('pos')" id="mod-btn-pos" class="px-2.5 py-1.5 rounded-lg text-[11px] font-extrabold bg-[#d96b27] text-white flex items-center gap-1.5 shrink-0 whitespace-nowrap">
        <i class="fa-solid fa-desktop"></i>
        <span>1. Terminal Caja NCR</span>
      </button>
      <button onclick="switchModule('inventory')" id="mod-btn-inventory" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-slate-300 hover:text-white flex items-center gap-1.5 shrink-0 whitespace-nowrap">
        <i class="fa-solid fa-boxes-stacked"></i>
        <span>2. Stock Autopartes</span>
        <span id="inv-mode-tag" class="text-[9px] bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded">Solo Lectura</span>
      </button>
      <button onclick="switchModule('quotes')" id="mod-btn-quotes" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-slate-300 hover:text-white flex items-center gap-1.5 shrink-0 whitespace-nowrap">
        <i class="fa-solid fa-print"></i>
        <span>3. Cotizaciones (A4 / WSP)</span>
        <span id="quotes-count-badge" class="bg-amber-500 text-slate-950 text-[10px] px-1.5 rounded-full font-black">2</span>
      </button>
      <button onclick="switchModule('audit')" id="mod-btn-audit" class="hidden px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-amber-300 hover:text-white bg-amber-950/50 border border-amber-500/30 flex items-center gap-1.5 shrink-0 whitespace-nowrap">
        <i class="fa-solid fa-file-invoice-dollar"></i>
        <span>4. Ventas y Devoluciones</span>
      </button>
      <button onclick="switchModule('owner')" id="mod-btn-owner" class="hidden px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-emerald-300 hover:text-white bg-emerald-950/60 border border-emerald-500/30 flex items-center gap-1.5 shrink-0 whitespace-nowrap">
        <i class="fa-solid fa-chart-pie"></i>
        <span>5. Panel Dueño y Reportes</span>
        <span id="owner-pending-counts-badge" class="bg-amber-400 text-slate-950 text-[10px] px-1.5 rounded-full font-black">1</span>
      </button>
      <button onclick="switchModule('programmer')" id="mod-btn-programmer" class="hidden px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-indigo-300 hover:text-white bg-indigo-950/60 border border-indigo-500/30 flex items-center gap-1.5 shrink-0 whitespace-nowrap">
        <i class="fa-solid fa-code"></i>
        <span>6. Panel Programador</span>
        <span id="prog-tickets-badge" class="bg-rose-500 text-white text-[10px] px-1.5 rounded-full font-black">2</span>
      </button>
    </nav>

    <div class="flex items-center gap-2 shrink-0">
      <div class="bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 text-right shrink-0">
        <span class="text-[8px] sm:text-[9px] text-slate-400 uppercase block leading-none">Fondo Fijo / Efectivo Cajón</span>
        <span id="header-drawer-status" class="font-mono-code font-bold text-[10px] sm:text-xs text-amber-400 whitespace-nowrap">Fondo: S/ 0.00 | Cajón: S/ 0.00</span>
      </div>

      <button onclick="triggerKey('DESLOGUEO')" class="px-2.5 py-1.5 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 rounded-lg text-xs font-bold transition-all shrink-0 whitespace-nowrap" title="Cambiar de Usuario / Desloguear">
        <i class="fa-solid fa-power-off"></i> <span class="hidden sm:inline">Salir</span>
      </button>

      <button onclick="toggleMobileMenu()" id="mobile-menu-btn" class="xl:hidden px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-600 rounded-lg text-sm font-black flex items-center gap-1.5 shrink-0">
        <i id="mobile-menu-icon" class="fa-solid fa-bars"></i>
        <span class="text-xs hidden sm:inline">Módulos</span>
      </button>
    </div>
  </div>

  <!-- MENÚ DESPLEGABLE HAMBURGUESA PARA MÓVILES Y TABLETS (< XL) -->
  <div id="mobile-nav-drawer" class="hidden xl:hidden mt-2 pt-2 border-t border-slate-800 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-1.5">
    <button onclick="switchModule('pos'); toggleMobileMenu(false);" id="mob-btn-pos" class="px-3 py-2 rounded-xl text-xs font-extrabold bg-[#d96b27] text-white flex items-center justify-between">
      <span><i class="fa-solid fa-desktop mr-2"></i>1. Terminal Caja NCR</span>
    </button>
    <button onclick="switchModule('inventory'); toggleMobileMenu(false);" id="mob-btn-inventory" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-200 flex items-center justify-between">
      <span><i class="fa-solid fa-boxes-stacked mr-2"></i>2. Stock Autopartes</span>
      <span id="mob-inv-mode-tag" class="text-[9px] bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded">Solo Lectura</span>
    </button>
    <button onclick="switchModule('quotes'); toggleMobileMenu(false);" id="mob-btn-quotes" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-200 flex items-center justify-between">
      <span><i class="fa-solid fa-print mr-2"></i>3. Cotizaciones (A4 / WSP)</span>
      <span id="mob-quotes-count-badge" class="bg-amber-500 text-slate-950 text-[10px] px-1.5 rounded-full font-black">2</span>
    </button>
    <button onclick="switchModule('audit'); toggleMobileMenu(false);" id="mob-btn-audit" class="hidden px-3 py-2 rounded-xl text-xs font-bold bg-amber-950/60 text-amber-300 border border-amber-500/30 flex items-center justify-between">
      <span><i class="fa-solid fa-file-invoice-dollar mr-2"></i>4. Ventas y Devoluciones</span>
    </button>
    <button onclick="switchModule('owner'); toggleMobileMenu(false);" id="mob-btn-owner" class="hidden px-3 py-2 rounded-xl text-xs font-bold bg-emerald-950/60 text-emerald-300 border border-emerald-500/30 flex items-center justify-between">
      <span><i class="fa-solid fa-chart-pie mr-2"></i>5. Panel Dueño y Reportes</span>
      <span id="mob-owner-pending-badge" class="bg-amber-400 text-slate-950 text-[10px] px-1.5 rounded-full font-black">1</span>
    </button>
    <button onclick="switchModule('programmer'); toggleMobileMenu(false);" id="mob-btn-programmer" class="hidden px-3 py-2 rounded-xl text-xs font-bold bg-indigo-950/60 text-indigo-300 border border-indigo-500/30 flex items-center justify-between">
      <span><i class="fa-solid fa-code mr-2"></i>6. Panel Programador</span>
      <span id="mob-prog-tickets-badge" class="bg-rose-500 text-white text-[10px] px-1.5 rounded-full font-black">2</span>
    </button>
  </div>
</header>

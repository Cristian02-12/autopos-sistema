<section id="module-inventory" class="hidden h-full overflow-y-auto p-4 sm:p-6 bg-slate-100 space-y-4">
  <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
    <div>
      <div class="flex flex-wrap items-center gap-2">
        <h2 class="text-lg font-extrabold text-slate-900">Centro de Gestión de Stock y Almacén de Autopartes</h2>
        <span id="inv-role-banner" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800"></span>
      </div>
      <p class="text-xs text-slate-500 mt-0.5">
        Separación inteligente de stock, conteo cíclico de lunes a viernes por categorías, recepción de mercadería y actualización de precios.
      </p>
    </div>

    <div class="flex flex-wrap items-center gap-1.5 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
      <button onclick="switchInventorySubtab('catalog')" id="inv-subtab-btn-catalog" class="px-3 py-1.5 rounded-lg text-xs font-black bg-slate-900 text-white shadow flex items-center gap-1.5">
        <i class="fa-solid fa-boxes-stacked text-amber-400"></i>
        <span>1. Catálogo y Stock</span>
      </button>
      <button onclick="switchInventorySubtab('count')" id="inv-subtab-btn-count" class="hidden px-3 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:text-slate-900 flex items-center gap-1.5">
        <i class="fa-solid fa-clipboard-check text-indigo-600"></i>
        <span>2. Conteo Inventario (L-V)</span>
      </button>
      <button onclick="switchInventorySubtab('restock')" id="inv-subtab-btn-restock" class="hidden px-3 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:text-slate-900 flex items-center gap-1.5">
        <i class="fa-solid fa-truck-ramp-box text-emerald-600"></i>
        <span>3. Ingreso Nueva Mercadería</span>
      </button>
      <button onclick="switchInventorySubtab('pricing')" id="inv-subtab-btn-pricing" class="hidden px-3 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:text-slate-900 flex items-center gap-1.5">
        <i class="fa-solid fa-tags text-amber-600"></i>
        <span>4. Actualizar Precios</span>
      </button>
      <div id="inv-admin-actions" class="hidden pl-1 border-l border-slate-300">
        <button onclick="openNewProductModal()" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-plus"></i> Nuevo Repuesto
        </button>
      </div>
    </div>
  </div>

  <!-- Sub-componentes de Inventario -->
  <app-tabla-stock />
  <app-conteo-ciclico />
  <app-ingreso-mercaderia />
  <app-actualizar-precios />
</section>

<!-- MODAL PARA AGREGAR NUEVO REPUESTO -->
<div id="new-product-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
  <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden border border-slate-200">
    <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
      <h3 class="font-extrabold text-sm flex items-center gap-2">
        <i class="fa-solid fa-box-open text-amber-400"></i> Registrar Nuevo Repuesto en Inventario
      </h3>
      <button onclick="closeNewProductModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form onsubmit="saveNewProduct(event)" class="p-6 space-y-3 text-xs">
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="font-bold text-slate-700 block mb-1">Cód. Barras:</label>
          <input type="text" id="np-barcode" required placeholder="Ej. 02200205" class="w-full p-2 border border-slate-300 rounded-lg font-mono-code">
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">SKU Interno:</label>
          <input type="text" id="np-sku" required placeholder="Ej. FR-501" class="w-full p-2 border border-slate-300 rounded-lg font-mono-code">
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">Código OEM:</label>
          <input type="text" id="np-oem" required placeholder="04465-0D150" class="w-full p-2 border border-slate-300 rounded-lg font-mono-code">
        </div>
      </div>
      <div>
        <label class="font-bold text-slate-700 block mb-1">Descripción de la Autoparte:</label>
        <input type="text" id="np-name" required placeholder="Ej. Pastillas de Freno Cerámica Delanteras" class="w-full p-2 border border-slate-300 rounded-lg">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold text-slate-700 block mb-1">Marca Fabricante:</label>
          <input type="text" id="np-brand" required placeholder="Ej. Kashiyama / Bosch" class="w-full p-2 border border-slate-300 rounded-lg">
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">Ubicación Estante:</label>
          <input type="text" id="np-location" required placeholder="Ej. Pasillo A - Estante 2" class="w-full p-2 border border-slate-300 rounded-lg">
        </div>
      </div>
      <div>
        <label class="font-bold text-slate-700 block mb-1">Modelos de Autos Compatibles:</label>
        <input type="text" id="np-vehicles" required placeholder="Ej. Toyota Yaris 2015-2021, Toyota Etios" class="w-full p-2 border border-slate-300 rounded-lg">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold text-slate-700 block mb-1">Precio Venta (S/):</label>
          <input type="number" step="0.10" id="np-price" required placeholder="95.00" class="w-full p-2 border border-slate-300 rounded-lg font-mono-code">
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">Stock Inicial:</label>
          <input type="number" id="np-stock" required value="10" class="w-full p-2 border border-slate-300 rounded-lg font-mono-code">
        </div>
      </div>
      <div class="pt-3 flex justify-end gap-2 border-t border-slate-200">
        <button type="button" onclick="closeNewProductModal()" class="px-4 py-2 rounded-xl border border-slate-300 font-bold">Cancelar</button>
        <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 text-white font-bold">Guardar Repuesto</button>
      </div>
    </form>
  </div>
</div>

server.port=8080
spring.datasource.url=${DB_PROD_URL:jdbc:postgresql://localhost:5432/autopos_prod_db}
spring.datasource.username=${DB_PROD_USER:postgres}
spring.datasource.password=${DB_PROD_PASS:clave_segura_produccion}
# En producción NUNCA se borran tablas automáticamente (validate protege los datos)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Pool HikariCP optimizado para alta carga de ventas e inventario
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000